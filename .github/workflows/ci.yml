name: ci

# `main` does not exist yet: by the owner's directive it is created only at a milestone merge
# (ARC-01-S01's branch-model reconciliation, 2026-09-07). Until then the integration branch is
# `develop` and the work lands on `arc-*/**`, so all three are triggers — a workflow that only
# watched `main` would never run during ARC-01 and would be unprovable.
on:
  push:
    branches: [main, develop, 'arc-*/**']
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job uses a secret. Nothing here can be run by a fork with elevated permissions.
permissions:
  contents: read

jobs:
  test:
    # NOTE ON THE WINDOWS CELL: it runs on the hosted image, which SHIPS GIT BASH. This job is not,
    # and must not be mistaken for, the "no Git Bash on PATH" proof — that is ARC-09-S08 and needs a
    # machine where the shell is genuinely absent (owner input #2). What this cell does prove is
    # weaker and still worth having: every step is `npm …` or `node …`, so nothing here *calls* a
    # POSIX shell (Q-B).
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules until ARC-03 adds vendor/ServiceNowDocs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record the resolved runner image
        run: node -e "console.log(process.platform, process.arch, 'node', process.version)"
      - run: npm ci --ignore-scripts
      - name: Assert the install changed nothing tracked
        run: node scripts/ci/assert-clean.mjs
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  footprint:
    name: footprint (production install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      # Summed file content, not `du`: du block-rounds and differs per OS (72 MB vs 57.3 MB on the
      # same tree, ARC-01-S05), so only the content figure is comparable across the matrix.
      - run: node scripts/ci/footprint.mjs 80

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # gitleaks needs history, not just the tip
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      # vendor/ServiceNowDocs does not exist yet — ARC-03 adds it. The exclusion lands NOW because
      # that corpus trips 592 gitleaks rules (curl-auth-user x526: `curl -u user:password` examples
      # in ServiceNow's own REST API pages, measured in ARC-01-S02). Without this, CI turns
      # permanently red the day ARC-03 merges, for findings that are documentation.
      - run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  plugin-validate:
    name: plugin validate (advisory)
    runs-on: ubuntu-latest
    # Advisory, and it stays advisory until two separate things are true. ARC-00 spike S-19 is
    # CONFIRMED (headless `plugin validate` works on all three runners, needs no login and does
    # discriminate), but making a job REQUIRED means wiring branch-protection contexts, and `main`
    # — the branch that carries protection — does not exist until the milestone merge. Whoever
    # performs that merge flips this to `false` and adds the context.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: an unpinned global install makes this job's result depend on whatever was published
      # that morning, which is not a signal anyone can act on.
      - run: npm i -g @anthropic-ai/claude-code@2.1.258
      - run: claude --version
      - run: claude plugin validate .claude/skills
      - run: claude plugin validate .claude/agents
