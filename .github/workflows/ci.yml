name: ci

# Two long-lived branches: `develop` integrates, and `main` (created at the M1 milestone merge,
# 2026-09-08) is the release line. Both are push triggers because a commit reaches them by merge,
# and a merge result nobody built is a result nobody has.
#
# Work branches are NOT push triggers. They were, and a push to one that already had a pull
# request open started two full 25-job matrices for the same commit — which is not just twice the
# CI bill: the two runs share a runner pool, and the contention made a server test's teardown race
# a child process it had not waited for (2026-09-08, `macos-latest` / node 24, ENOTEMPTY). Every
# work branch reaches CI through `pull_request` instead, which is where its result is read; the
# process rule that makes that reliable is in docs/CONTRIBUTING.md — a story branch gets its draft
# PR at first push.
on:
  push:
    branches: [main, develop]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job uses a secret. Nothing here can be run by a fork with elevated permissions.
permissions:
  contents: read

jobs:
  test:
    # NOTE ON THE WINDOWS CELL: it runs on the hosted image, which SHIPS GIT BASH. This job is not,
    # and must not be mistaken for, the "no Git Bash on PATH" proof — that is ARC-09-S08 and needs a
    # machine where the shell is genuinely absent (owner input #2). What this cell does prove is
    # weaker and still worth having: every step is `npm …` or `node …`, so nothing here *calls* a
    # POSIX shell (Q-B).
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules until ARC-03 adds vendor/ServiceNowDocs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record the resolved runner image
        run: node -e "console.log(process.platform, process.arch, 'node', process.version)"
      - run: npm ci --ignore-scripts
      - name: Assert the install changed nothing tracked
        run: node scripts/ci/assert-clean.mjs
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  contract:
    # The contract gate, on every cell. It SUBSUMES the old `dist-check` job: its first step is the
    # same rebuild-and-diff, and three more follow — the server's own invariants, the generated
    # texts, and the engine's pin. One command, the same one a developer and the release script
    # run, so a failure here is reproducible with `npm run contract` rather than a CI-only ritual.
    #
    # Three OSes because Windows is where the LF rule earns its place: without `text eol=lf` in
    # .gitattributes the checkout rewrites every line and step 1's diff is 100 % noise. Three Node
    # lines because the generators and the gate are the code most likely to depend on a runtime
    # detail — a path separator, a JSON key order, a newly available built-in.
    #
    # No `needs:`. There is no separate lint job to wait for — `npm run lint` runs inside `test` —
    # and waiting for the whole nine-cell test matrix would double the critical path to save a
    # fifteen-second job.
    name: contract (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show the attributes that make dist/ diffable
        run: git check-attr -a packages/snowarch/dist/server.js
      - run: npm run contract
      - name: Explain a failure
        if: failure()
        # The gate already printed the failing step and its remedy. This adds the file names for
        # the one failure whose output is a stat rather than a message.
        run: |
          echo "Reproduce locally with: npm run contract"
          git diff --stat -- packages/snowarch/dist || true

  no-build:
    # The committed artefact, exercised with NO build step — the state a user is actually in
    # after `git clone && npm ci`. The suite above always builds first (`pretest`), so without
    # this job a dist/ that never ran would still be green everywhere.
    name: no-build handshake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Handshake against the committed dist/, without building it
        working-directory: packages/snowarch
        run: npx vitest run --no-coverage tests/server/unconfigured.test.ts tests/server/handshake.test.ts

  docs-check:
    # The package README's factual tables are generated from dist/contract.json and the built
    # permissions module. This job is what stops them drifting — P-30 is the whole reason: the
    # 1.x docs described OIDC/SSO, an org-config path and an "allow any table" switch, none of
    # which existed, and prose has no way to notice that about itself.
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The README's generated blocks match the code
        run: node scripts/gen-readme-tables.mjs --check
      - name: No retired 1.x surface is documented anywhere
        # Criterion 3. `|| true` on the grep and an explicit test, so the step fails on a MATCH
        # rather than on grep's exit code being 1 for "nothing found" — which is success here.
        run: |
          set -o pipefail
          # The last alternative matches the OLD repository URL without spelling it: the
          # legacy-name ratchet forbids that literal anywhere outside its own allow-list, and a
          # grep pattern is still a use of the string. `.` for the hyphen keeps the pattern out
          # of the ratchet's way while matching what it is looking for.
          hits=$(grep -rnE "OIDC|SNMCP_ORG_CONFIG|ALLOW_ANY_TABLE|/auth/login|claude mcp add servicenow --command|github[.]com/[a-z]+/servicenow.mcp" \
            packages/snowarch/src packages/snowarch/README.md packages/snowarch/.env.example \
            packages/snowarch/SECURITY.md || true)
          if [ -n "$hits" ]; then
            echo "Retired 1.x surface is still documented:"
            echo "$hits"
            exit 1
          fi
          echo "clean"

  footprint:
    name: footprint (production install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      # Summed file content, not `du`: du block-rounds and differs per OS (72 MB vs 57.3 MB on the
      # same tree, ARC-01-S05), so only the content figure is comparable across the matrix.
      - run: node scripts/ci/footprint.mjs 80

  actionlint:
    # The workflows are code and nothing else checks them. ARC-03-S09 added a second workflow with a
    # multi-line shell step, `gh` calls and expression interpolation — three things a typo survives
    # in until the schedule fires at 05:17 on a Monday and nobody is looking.
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (pinned)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version
      - name: Lint every workflow
        run: /tmp/actionlint -color

  launcher:
    # `bootstrap.sh` is the one file that runs on a machine with NO Node — which means none of the
    # engine's own tooling can check it, and none of the other jobs would notice it broken. Two
    # things here: shellcheck, and a real run with Node stripped from PATH, because "it parses" and
    # "it works without Node" are different claims and only the second is the story.
    name: launcher
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (pinned)
        run: |
          curl -sSfL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.$(uname -s | tr '[:upper:]' '[:lower:]').x86_64.tar.xz"
          tar -xJf /tmp/sc.tar.xz -C /tmp
          /tmp/shellcheck-v0.10.0/shellcheck --version
      - name: shellcheck
        run: /tmp/shellcheck-v0.10.0/shellcheck -s bash --severity=warning bootstrap.sh
      - name: bash -n
        run: bash -n bootstrap.sh
      - name: The Node-free design-only path, with Node removed from PATH
        # The whole point of this job. `command -v node` must find nothing, so PATH is rebuilt from
        # the system directories rather than filtered — a filter that missed one entry would test
        # the hand-over instead, and pass.
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin TERM=dumb \
            bash -o posix ./bootstrap.sh --mode design --yes --docs skip --skip-claude-check
      - name: The state it wrote is the one Node reads
        run: |
          node --input-type=module -e "
            import { loadState, assertStorable } from './tools/snowarch/lib/state.mjs';
            const s = loadState(process.cwd());
            if (s.writer !== 'bash') { console.error('writer is', s.writer); process.exit(1); }
            assertStorable(s);
            console.log('state ok:', s.version, s.writer, Object.keys(s.steps).length, 'steps');
          "

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # gitleaks needs history, not just the tip
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      # vendor/ServiceNowDocs does not exist yet — ARC-03 adds it. The exclusion lands NOW because
      # that corpus trips 592 gitleaks rules (curl-auth-user x526: `curl -u user:password` examples
      # in ServiceNow's own REST API pages, measured in ARC-01-S02). Without this, CI turns
      # permanently red the day ARC-03 merges, for findings that are documentation.
      - run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    # No longer advisory at the JOB level. ARC-00 spike S-19 is CONFIRMED — headless `plugin validate`
    # works on all three runners, needs no login, and does discriminate — so a genuine validation
    # failure should turn this workflow red. What is still outstanding is making it a REQUIRED status
    # check, which needs branch-protection contexts on `main`, and `main` does not exist until the
    # milestone merge. Whoever performs that merge adds the context; nothing here changes then.
    #
    # The one thing that must never turn this red is the CLI being absent (ARC-02-S02 criterion 7):
    # the install step tolerates failure and the validate steps are guarded, so an unreachable
    # registry skips the check with a reason instead of reporting a validation problem that nobody
    # can act on.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: an unpinned global install makes this job's result depend on whatever was published
      # that morning, which is not a signal anyone can act on.
      - name: install the pinned CLI
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code@2.1.258
      - name: is the CLI on PATH?
        id: cli
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            claude --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: skipped
        if: steps.cli.outputs.available != 'true'
        run: echo "claude CLI not available on this runner (S-19)"
      # --strict promotes warnings to failures. S-19 found it rejects a missing `author` where the
      # component type requires one; both directories pass it at the pinned version, so the strict
      # form is the one worth running — the lax form lets a warning through unnoticed.
      - name: validate .claude/skills
        if: steps.cli.outputs.available == 'true'
        run: claude plugin validate .claude/skills --strict
      - name: validate .claude/agents
        if: steps.cli.outputs.available == 'true'
        run: claude plugin validate .claude/agents --strict

      # L10 is the same check inside the engine lint. Here — where the CLI is installed — it runs
      # with `--require-claude`, so a job that lost its CLI fails as misconfigured instead of
      # reporting a reassuring skip. The `lint` job runs the same check without the flag and says
      # it skipped, which is honest: enforcement lives where the tool is.
      - name: engine lint L10 against the installed CLI
        if: steps.cli.outputs.available == 'true'
        run: node packages/contract/lint/engine-lint.mjs --only L10 --require-claude
